version: 2
updates:
  # This repository's own workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "ci"
      - "dependencies"

  # Three independent npm projects live under dashboard/ (no root package.json / no npm
  # workspaces), so each needs its own entry pointed at its own package-lock.json.
  - package-ecosystem: "npm"
    directory: "/dashboard/web"
    schedule:
      interval: "weekly"
    labels:
      - "chore"
      - "dependencies"
    # React and its type packages must move together (a react/@types/react major split
    # leaves the tree uninstallable), so Dependabot proposes them as one PR.
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"

  - package-ecosystem: "npm"
    directory: "/dashboard/control-room"
    schedule:
      interval: "weekly"
    labels:
      - "chore"
      - "dependencies"
    # CI (dashboard.yml) runs on Node 22, so @types/node majors beyond that would type
    # APIs the runtime does not have.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/dashboard/aggregator"
    schedule:
      interval: "weekly"
    labels:
      - "chore"
      - "dependencies"
    # CI (dashboard.yml) runs on Node 22, so @types/node majors beyond that would type
    # APIs the runtime does not have.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # No pip/pyproject.toml ecosystem entry: registry/ and poc/capability-contract/ are
  # dependency-free (standard library only -- confirmed by inspection, no
  # requirements.txt/pyproject.toml/Pipfile exists anywhere in this repository), so
  # there is nothing for Dependabot's pip ecosystem to track.

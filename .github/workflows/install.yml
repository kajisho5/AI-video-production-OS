name: Ecosystem install

# Keeps install.sh honest: the offline checks on every change to the installer or the list
# of repositories it installs (ecosystem.json), on Linux and on macOS (whose /bin/bash is
# 3.2), and a real install of every repository from GitHub -- which can break without any
# change here, when a Skill repository changes -- weekly and on demand. The `check` job also
# runs the reference Capability registry's tests (registry/, docs/ROADMAP.md Phase 1).

on:
  pull_request:
    paths:
      - "install.sh"
      - "scripts/**"
      - "registry/**"
      - "ecosystem.json"
      - "docs/ecosystem/registry.json"
      - ".github/workflows/install.yml"
  push:
    branches: [main]
    paths:
      - "install.sh"
      - "scripts/**"
      - "registry/**"
      - "ecosystem.json"
      - "docs/ecosystem/registry.json"
      - ".github/workflows/install.yml"
  schedule:
    - cron: "17 3 * * 1" # weekly
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        if: runner.os == 'Linux'
        run: shellcheck install.sh scripts/bootstrap.sh
      - name: Manifest and installer tests (offline)
        env:
          AVOS_TEST_BASH: /bin/bash
        run: python3 -m unittest discover -s scripts/tests -v
      # 62 tests. On a stock runner 21 of them skip, by design, and say why in the log:
      #   11 "qc-skill's `qc` console script is not on PATH" -- test_conformance_live.py runs the
      #      conformance checks against a live qc-skill process; this job does not install qc-skill.
      #   10 "jsonschema package not installed" -- test_schema.py's validation tests; registry/ is
      #      dependency-free and jsonschema is only an optional test dependency.
      # Measured with `python3 -m unittest discover -s registry/tests -t . -v` in a fresh venv.
      - name: Capability registry tests (offline)
        run: python3 -m unittest discover -s registry/tests -t . -v

  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22" # hyperframes-skill needs Node 22+
      - name: Install every repository in ecosystem.json from GitHub
        run: ./install.sh --dir "$RUNNER_TEMP/avos" --with-optional 2>&1 | tee "$RUNNER_TEMP/install.log"
      - name: Fail on any install failure
        run: |
          if grep -E 'clone failed|pip install failed|npm install failed|needs Node.js|unknown install kind' "$RUNNER_TEMP/install.log"; then
            exit 1
          fi

name: Ecosystem Dashboard

# Builds and deploys the GitHub Pages site:
#   /                              the landing page (site/, static, no build step)
#   /dashboard/                    the Ecosystem Dashboard (dashboard/web, current OS/repo state)
#   /dashboard/control-room.html   the Ecosystem Control Room (dashboard/control-room, cross-repo
#                    development read model: roadmap, tasks, PR/CI state, SI findings)
# See docs/adr/ADR-011-ecosystem-dashboard.md for the Dashboard's architecture and
# dashboard/control-room/src/types.ts for the Control Room's read model.
#
# This is the ONLY job in this project that touches a GitHub token capable of reading
# other repositories in the ecosystem, and it runs entirely server-side in Actions --
# the built static site the browser receives contains no token, and dashboard/web's own
# code never calls the GitHub API (verified in dashboard/README.md's security section).
#
# One-time manual setup required (cannot be done from this workflow):
#   Settings -> Pages -> Source: "GitHub Actions"
# Optional: add a repository secret ECOSYSTEM_GITHUB_TOKEN (a fine-grained PAT, read-only,
# scoped to this project's repositories) for higher rate limits or if any ecosystem repo
# becomes private. Without it, the workflow's own ambient GITHUB_TOKEN is used, which is
# sufficient for reading public repository data.

on:
  schedule:
    - cron: "0 * * * *" # hourly -- the ecosystem's own repos change independently of this repo
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - "site/**"
      - "docs/ROADMAP.md"
      - "docs/ecosystem/registry.json"
      - "docs/ecosystem/capability-status.json"
      - "docs/ecosystem/WORK_QUEUE.md"
      - "docs/ecosystem/DECISION_LOG.md"
      - ".github/workflows/dashboard.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install aggregator dependencies
        working-directory: dashboard/aggregator
        run: npm ci

      - name: Typecheck aggregator
        working-directory: dashboard/aggregator
        run: npm run typecheck

      - name: Test aggregator
        working-directory: dashboard/aggregator
        run: npm test

      - name: Generate ecosystem snapshot
        working-directory: dashboard/aggregator
        env:
          GITHUB_TOKEN: ${{ secrets.ECOSYSTEM_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        run: npm run generate

      - name: Install control-room dependencies
        working-directory: dashboard/control-room
        run: npm ci

      - name: Typecheck control-room
        working-directory: dashboard/control-room
        run: npm run typecheck

      - name: Test control-room
        working-directory: dashboard/control-room
        run: npm test

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # kajisho5/system-intelligence audits this repository read-only; the Control Room's
      # Intelligence panel shows its findings. A failure here only leaves that panel saying
      # "no snapshot" -- it never blocks the deploy.
      - name: System Intelligence snapshot
        id: si
        continue-on-error: true
        env:
          SI_READ_ONLY: "1"  # system-intelligence ADR-013
        run: |
          python -m pip install -q "git+https://github.com/kajisho5/system-intelligence"
          si diagnose . --out "$RUNNER_TEMP/si"
          echo "dir=$(ls -d "$RUNNER_TEMP"/si/snapshot-* | head -1)" >> "$GITHUB_OUTPUT"

      - name: Generate control-room snapshot
        working-directory: dashboard/control-room
        env:
          GITHUB_TOKEN: ${{ secrets.ECOSYSTEM_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          SI_SNAPSHOT_DIR: ${{ steps.si.outputs.dir }}
        run: npm run generate

      - name: Install web dependencies
        working-directory: dashboard/web
        run: npm ci

      - name: Typecheck web
        working-directory: dashboard/web
        run: npm run typecheck

      - name: Test web
        working-directory: dashboard/web
        run: npm test

      - name: Verify no secret leaked into the built bundle
        working-directory: dashboard/web
        run: npm run build
        # A real token never appears literally in aggregator output (it is only ever
        # used as an Authorization header value, never echoed into snapshot data), so
        # this check guards against a future regression rather than a known risk today.

      - name: Fail if a GitHub token literal ended up in the client bundle
        run: |
          if grep -rE "gh[ps]_[A-Za-z0-9]{20,}" dashboard/web/dist/ ; then
            echo "::error::A GitHub token literal was found in the built client bundle."
            exit 1
          fi
          echo "Clean: no token pattern found in dashboard/web/dist/"

      # The landing page is the site root and the dashboard build goes under dashboard/.
      # site/ also carries the redirects for the old /lp/ and /control-room.html URLs and a
      # sw.js that retires the service worker the dashboard used to register at the root.
      - name: Assemble the site
        run: |
          rm -rf _site
          mkdir -p _site
          cp -R site/. _site/
          cp -R dashboard/web/dist _site/dashboard
          if grep -rE "gh[ps]_[A-Za-z0-9]{20,}" _site/ ; then
            echo "::error::A GitHub token literal was found in the assembled site."
            exit 1
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4

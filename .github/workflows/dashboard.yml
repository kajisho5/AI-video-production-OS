name: Ecosystem Dashboard

# Builds and deploys two read-only pages to GitHub Pages from one dashboard/web build:
#   /                the Ecosystem Dashboard (dashboard/, current OS/repo state)
#   /control-room.html   the Ecosystem Control Room (dashboard/control-room, cross-repo
#                    development read model: roadmap, tasks, PR/CI state, SI findings)
# See docs/adr/ADR-011-ecosystem-dashboard.md for the Dashboard's architecture and
# dashboard/control-room/src/types.ts for the Control Room's read model.
#
# This is the ONLY job in this project that touches a GitHub token capable of reading
# other repositories in the ecosystem, and it runs entirely server-side in Actions --
# the built static site the browser receives contains no token, and dashboard/web's own
# code never calls the GitHub API (verified in dashboard/README.md's security section).
#
# One-time manual setup required (cannot be done from this workflow):
#   Settings -> Pages -> Source: "GitHub Actions"
# Optional: add a repository secret ECOSYSTEM_GITHUB_TOKEN (a fine-grained PAT, read-only,
# scoped to this project's repositories) for higher rate limits or if any ecosystem repo
# becomes private. Without it, the workflow's own ambient GITHUB_TOKEN is used, which is
# sufficient for reading public repository data.

on:
  schedule:
    - cron: "0 * * * *" # hourly -- the ecosystem's own repos change independently of this repo
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - "docs/ROADMAP.md"
      - "docs/ecosystem/registry.json"
      - "docs/ecosystem/capability-status.json"
      - "docs/ecosystem/WORK_QUEUE.md"
      - "docs/ecosystem/DECISION_LOG.md"
      - ".github/workflows/dashboard.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install aggregator dependencies
        working-directory: dashboard/aggregator
        run: npm ci

      - name: Typecheck aggregator
        working-directory: dashboard/aggregator
        run: npm run typecheck

      - name: Test aggregator
        working-directory: dashboard/aggregator
        run: npm test

      - name: Generate ecosystem snapshot
        working-directory: dashboard/aggregator
        env:
          GITHUB_TOKEN: ${{ secrets.ECOSYSTEM_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        run: npm run generate

      - name: Install control-room dependencies
        working-directory: dashboard/control-room
        run: npm ci

      - name: Typecheck control-room
        working-directory: dashboard/control-room
        run: npm run typecheck

      - name: Test control-room
        working-directory: dashboard/control-room
        run: npm test

      - name: Generate control-room snapshot
        working-directory: dashboard/control-room
        env:
          GITHUB_TOKEN: ${{ secrets.ECOSYSTEM_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          # No SI_SNAPSHOT_DIR here: this repository does not generate or bundle a
          # System Intelligence snapshot. If one is ever produced for this target and
          # committed/fetched somewhere in CI, point this at that directory.
        run: npm run generate

      - name: Install web dependencies
        working-directory: dashboard/web
        run: npm ci

      - name: Typecheck web
        working-directory: dashboard/web
        run: npm run typecheck

      - name: Test web
        working-directory: dashboard/web
        run: npm test

      - name: Verify no secret leaked into the built bundle
        working-directory: dashboard/web
        run: npm run build
        # A real token never appears literally in aggregator output (it is only ever
        # used as an Authorization header value, never echoed into snapshot data), so
        # this check guards against a future regression rather than a known risk today.

      - name: Fail if a GitHub token literal ended up in the client bundle
        run: |
          if grep -rE "gh[ps]_[A-Za-z0-9]{20,}" dashboard/web/dist/ ; then
            echo "::error::A GitHub token literal was found in the built client bundle."
            exit 1
          fi
          echo "Clean: no token pattern found in dashboard/web/dist/"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/web/dist

      - id: deployment
        uses: actions/deploy-pages@v4
